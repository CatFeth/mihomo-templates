name: Download Templates by CatFeth

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directory if not exists
        run: |
          mkdir -p by-catfeth/subscription-templates
          
      - name: Download Mihomo Quantum-direct template
        run: |
          curl -L "https://raw.githubusercontent.com/CatFeth/mihomo-templates/refs/heads/main/q-direct.yaml" \ 
          -o "by-catfeth/subscription-templates/q-direct.yaml"
          
      - name: Download Mihomo Quantum-proxy template
        run: |
          curl -L "https://raw.githubusercontent.com/CatFeth/mihomo-templates/refs/heads/main/q-proxy.yaml" \
          -o "by-catfeth/subscription-templates/q-proxy.yaml/
        
          
      - name: Commit and push if there are changes
        run: |
          git config --local user.email "CatFeth@users.noreply.github.com"
          git config --local user.name "CatFeth"
          git add by-catfeth/subscription-templates/
          git commit -m "Update subscription templates configs" -a || echo "No changes to commit"
          git push
