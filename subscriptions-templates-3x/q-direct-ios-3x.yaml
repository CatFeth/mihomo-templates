rules:
  # DNS HIJACK
  - DST-PORT,53,DNS-OUT
  # Private
  - RULE-SET,geosite-private,DIRECT
  - RULE-SET,geoip-private,DIRECT,no-resolve
  # QUIC aka Huinya ebannaya
  - RULE-SET,quic,REJECT-DROP
  # Torrent
  - OR,((RULE-SET,torrent-clients),(RULE-SET,torrent-trackers)),DIRECT
  # Russian Domains & IPs
  - OR,((RULE-SET,geosite-ru),(RULE-SET,geoip-ru),(RULE-SET,geosite-ru-2),(RULE-SET,geoip-ru-2)),DIRECT
  # ASN | RU
    # CDN
  - RULE-SET,as-ddosguard,DIRECT
  - RULE-SET,as-curator@ru,DIRECT
  - RULE-SET,as-stormwall@ru,DIRECT
    # Services
  - RULE-SET,as-vk,DIRECT
  - RULE-SET,as-yandex,DIRECT
  - RULE-SET,as-wildberries,DIRECT
  # CDN & DOH
  - RULE-SET,fastly-ip,⚫ VPN
  - RULE-SET,cloudfront,⚫ VPN
  - RULE-SET,cloudflare-ip,⚫ VPN
  - OR,((RULE-SET,doh),(RULE-SET,cdn)),⚫ VPN
  # ASN | EU
    # CDN
  - RULE-SET,as-cdn,⚫ VPN
  - RULE-SET,as-stormwall@eu,⚫ VPN
  # Services
    # RULE-SET
  - RULE-SET,anime,⚫ VPN
  - RULE-SET,twitch,⚫ VPN
  - RULE-SET,reddit,⚫ VPN
  - RULE-SET,tiktok,⚫ VPN
  - RULE-SET,netflix,⚫ VPN
  - RULE-SET,telegram,⚫ VPN
  - RULE-SET,remnawave,⚫ VPN
  - RULE-SET,allow-russian,⚫ VPN
  - OR,((RULE-SET,discord),(RULE-SET,discord-voice)),⚫ VPN
  - OR,((RULE-SET,companies),(RULE-SET,companies-ip)),⚫ VPN
  # AI
  - RULE-SET,ai-ru,DIRECT
  - OR,((RULE-SET,ai),(RULE-SET,ai-cn)),⚫ VPN
  # Games Companies
  - OR,((RULE-SET,steam),(RULE-SET,rockstar),(RULE-SET,epicgames),(RULE-SET,gog),(RULE-SET,riot)),DIRECT
  - OR,((RULE-SET,ubisoft),(RULE-SET,nintendo),(RULE-SET,blizzard)),⚫ VPN
  # Games
  - RULE-SET,roblox,⚫ VPN
  - RULE-SET,modrinth,⚫ VPN
  - RULE-SET,games-direct,DIRECT
  # Music
  - OR,((RULE-SET,spotify),(RULE-SET,soundcloud),(RULE-SET,tidal),(RULE-SET,deezer),(RULE-SET,bandcamp)),⚫ VPN
  # File Sharing
  - RULE-SET,file-sharing,⚫ VPN
  # Exit
  - MATCH,DIRECT