x-anchors:
  reserved_ips: &reserved_ips
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
  
  geoip-private: &private_ip
    type: inline
    behavior: ipcidr
    payload:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.0.2.0/24
      - 192.88.99.0/24
      - 192.168.0.0/16
      - 198.18.0.0/15
      - 198.51.100.0/24
      - 203.0.113.0/24
      - 224.0.0.0/3
      - ::/127
      - fc00::/7
      - fe80::/10
      - ff00::/8

  quic: &quic
    type: inline
    behavior: classical
    payload:
      - AND,((NETWORK,udp),(DST-PORT,443))

  dns_ru: &dns_ru
    - 77.88.8.8
    - system

  dns_proxy: &dns_proxy
    - 1.1.1.1#⚫ VPN
    - 8.8.8.8#⚫ VPN

  pr_http: &pr_http
    type: http
    interval: 86400
    proxy: ⚫ VPN

  rp_classical: &rp_classical
    <<: *pr_http
    behavior: classical
    format: yaml

  rp_domain: &rp_domain
    <<: *pr_http
    behavior: domain
    format: mrs

  rp_ipcidr: &rp_ipcidr
    <<: *pr_http
    behavior: ipcidr
    format: mrs

mixed-port: 7890
tcp-concurrent: true
find-process-mode: strict
mode: rule
log-level: error
ipv6: true
keep-alive-interval: 30
keep-alive-idle: 30
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: *reserved_ips

tun:
  enable: true
  stack: mips
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  route-exclude-address: *reserved_ips

hosts:
  ntc.party: 130.255.77.28
dns:
  enable: true
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  cache-algorithm: arc
  prefer-h3: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:geosite-private
    - rule-set:geosite-fake-ip
  default-nameserver: *dns_ru
  nameserver: *dns_proxy
  proxy-server-nameserver: *dns_ru
  fallback:
    *dns_ru
  fallback-filter:
    geoip: false
  fallback-lazy-query: true
  nameserver-policy:
    rule-set:geosite-private:
      - system
    "rule-set:cdn,doh,companies,telegram,tiktok,twitch,reddit,netflix,discord,anime,remnawave,allow-russian,ai,ai-cn,nintendo,blizzard,ea,ubisoft,roblox,modrinth,spotify,soundcloud,deezer,bandcamp,tidal,file-sharing": *dns_proxy

proxy-providers:
  sub:
    type: http
    url: https://${DOMAIN}/${SUB_PATH}/${SUB_ID}?provider=1 # Вставить ссылку из файла /var/www/subpage/clash.yaml.tpl
    path: ./proxy_providers/base64.yml
    interval: 3600
    override:
      override-expr:
        - '(select(.type == "vless" and .["reality-opts"] != null) | .["reality-opts"]["support-x25519mlkem768"]) = true'
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

proxies:
  - name: DNS-OUT
    type: dns

proxy-groups:
  - name: ⚫ VPN
    type: select
    proxies:
      - 🔵 Auto-select
    use:
      - sub
  - name: 🔵 Auto-select
    type: fallback
    hidden: true
    url: https://www.gstatic.com/generate_204
    use:
      - sub

rule-providers:
# Private Domains & IPs
  geosite-fake-ip: {<<: *rp_domain, url: https://raw.githubusercontent.com/wwqgtxx/clash-rules/refs/heads/release/fakeip-filter.mrs}
  geosite-private: {<<: *rp_domain, url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/private.mrs}
  geoip-private: {<<: *private_ip}

# Quic
  quic: {<<: *quic}

# Torrent
  torrent-trackers: {<<: *rp_domain, url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/torrent-trackers.mrs}
  torrent-clients: {<<: *rp_classical, url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/torrent-clients.yaml}

# Russian Domains & IPs
