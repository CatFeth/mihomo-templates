    - 77.88.8.8
    - 77.88.8.1

  dns_proxy: &dns_proxy
    - https://1.1.1.1/dns-query#⚫ VPN
    - https://8.8.8.8/dns-query#⚫ VPN

  pr_http: &pr_http
    type: http
    interval: 86400
    proxy: ⚫ VPN

  rp_classical: &rp_classical
    <<: *pr_http
    behavior: classical
    format: yaml

  rp_domain: &rp_domain
    <<: *pr_http
    behavior: domain
    format: mrs

  rp_ipcidr: &rp_ipcidr
    <<: *pr_http
    behavior: ipcidr
    format: mrs

tcp-concurrent: true
enable-process: true
find-process-mode: strict
mode: rule
log-level: error
ipv6: false
keep-alive-interval: 30
keep-alive-idle: 30
unified-delay: true
geodata-loader: memconservative

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address: *reserved_ips

